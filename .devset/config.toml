# devset applies the profiles below to this directory, and keeps them up to date.
# The manual: https://atomix-labs.github.io/devset/
#
# Where profiles come from, each named once: a git repository at a ref, or a directory.
#
#   [sources]
#   atxp = { git = "https://github.com/atomix-labs/atxp", tag = "v0.4.0" }
#
# The profiles to apply, in order, by source and name, with the features to turn on.
#
#   [[layers]]
#   profile  = "atxp/rust"
#   features = ["docs"]

[sources]
atxp = { git = "https://github.com/atomix-labs/atxp", tag = "v0.18.0" }

[[layers]]
profile = "atxp/rust"
features = ["docs", "agents", "publish", "binaries", "oss", "nightly"]

[[layers]]
profile = "atxp/rust-msrv"

[[layers]]
profile = "atxp/python"

[[layers]]
profile = "atxp/vscode"

[[layers]]
profile = "atxp/suppressions"

[[layers]]
profile = "atxp/vhs"
features = ["merge"]

[[layers]]
profile = "atxp/mdbook"
features = ["mermaid"]

[[layers]]
profile = "atxp/cargo-binaries"
features = ["completions"]

[[layers]]
profile = "atxp/project"
features = ["devset-badge"]

[[layers]]
profile  = "atxp/github-templates"
features = ["discussions"]

[[layers]]
profile = "atxp/github-bump"
features = ["merge"]
