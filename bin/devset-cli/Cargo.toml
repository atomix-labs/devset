[package]
name                   = "devset-cli"
description            = "apply versioned file bundles to a directory, and update them without losing local edits."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
documentation          = "https://atomix-labs.github.io/devset/"
readme                 = "../../README.md"
keywords.workspace     = true
categories.workspace   = true

[[bin]]
name = "devset"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/devset-{ version }-{ target }{ archive-suffix }"
bin-dir = "devset{ binary-ext }"
pkg-fmt = "txz"

[features]
default = []

[lints]
workspace = true

[dependencies]
# external
annotate-snippets = { workspace = true }
anstream          = { workspace = true }
anstyle           = { workspace = true }
camino            = { workspace = true }
clap              = { workspace = true }
clap-cargo        = { workspace = true }
clap_complete     = { workspace = true }
derive_more       = { workspace = true }
dialoguer         = { workspace = true }
diffy             = { workspace = true }
fs-err            = { workspace = true }
github-actions    = { workspace = true }
schemars          = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
strsim            = { workspace = true }
textwrap          = { workspace = true }
toml              = { workspace = true }
# internal
devset-core = { workspace = true }

[dev-dependencies]
# external
snapbox  = { workspace = true }
tempfile = { workspace = true }
