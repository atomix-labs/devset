# Workspace dependency policy.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version      = 2
yanked       = "deny"
unmaintained = "all"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "hashbrown@0.14", reason = "rowan, the syntax tree under yaml-edit, pins 0.14; the tree is on 0.17" },
    { crate = "syn@2", reason = "derive_more-impl, the newest, is on syn 2; the tree is on 3" },
]

# Crates with a better choice, each naming it.
deny = [
    { name = "typed-builder", reason = "use bon (typestate + fn / method / impl builders)" },
    { name = "derive_builder", reason = "use bon (compile-time typestate, not runtime check)" },
    { name = "buildstructor", reason = "use bon (buildstructor lags on syn2 / edition 2024)" },
    { name = "strum_macros", reason = "depend on strum with features = [\"derive\"]; version-skew otherwise", wrappers = ["strum"] },
    { name = "enumflags2", reason = "use enumset (forward-compat past 64 variants, FFI repr override)" },
    { name = "modular-bitfield", reason = "use bitfield-struct (actively maintained mainstream choice)" },
    { name = "shrinkwraprs", reason = "unmaintained; superseded by derive_more" },
    { name = "newtype_derive", reason = "legacy custom_derive framework; superseded by derive_more" },
    { name = "derive_deref", reason = "superseded by derive_more::Deref" },
    { name = "variantly", reason = "unmaintained; superseded by derive_more::IsVariant / TryUnwrap" },
    { name = "enum-as-inner", reason = "superseded by derive_more::TryUnwrap (with ref / ref_mut)" },
    { name = "derive-getters", reason = "use getset / gset (active + slice-deref support)" },
    { name = "derive_setters", reason = "use bon for build flows; fragments call sites otherwise" },
    { name = "field_access", reason = "runtime reflection; wrong shape for HFT" },
    { name = "amplify_derive", reason = "use derive_more (smaller dependency tree)" },
    { name = "delegate-attr", reason = "use delegate (broader adoption, same surface)" },
    { name = "async-trait", reason = "no async on the trade path" },
    { name = "nix", reason = "use rustix (I/O-safe types, raw Linux syscalls); libc covers the rustix gap" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }
unused-allowed-license = "allow"

[sources]
unknown-registry  = "deny"
unknown-git       = "deny"
required-git-spec = "rev"
allow-git         = []
