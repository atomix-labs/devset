# Workspace dependency policy.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version      = 2
yanked       = "deny"
unmaintained = "all"

[bans]
multiple-versions    = "deny"
wildcards            = "deny"
allow-wildcard-paths = true
skip                 = []

[licenses]
version = 2
allow   = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "Zlib", "CC0-1.0"]

[sources]
unknown-registry  = "deny"
unknown-git       = "deny"
required-git-spec = "rev"
allow-git         = []
