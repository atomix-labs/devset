# How mise installs the tools every atom pins: from the lock, verified, and never a release younger
# than three days. min_version is the mise the setup stub installs, moved with it. Python runs
# .just/mise.py; uv installs the tools that come from PyPI.
min_version = "2026.9.12"

[settings]
lockfile = true
minimum_release_age = "3d"

[tools]
python = "3.14"
# pipx: tools install through uv.
uv = "0.12.17"
