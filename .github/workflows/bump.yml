# Once a week, moves everything the repository pins: `just bump` runs every `bump-*` recipe, `just
# fix` settles what they moved, and `just check` is the gate. The result goes to one signed commit,
# and as far as .github/automation.json says: `bump.mode` is `branch` or `pr`, the default, and
# `bump.merge`, which the feature `merge` sets, merges the pull request once the gate passes.
#
# With a GitHub App (`BUMP_APP_ID`, `BUMP_APP_KEY`), its pull request runs the repository's checks,
# which one opened with this run's token does not, and may change workflows.
name: bump

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: bump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - id: app
        if: vars.BUMP_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_KEY }}
          # Only what the bump does: its commit, its pull request, its issues.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every locked tool, then the task `bootstrap`: `just setup`, as on a laptop.
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.13
          bootstrap: true
      - name: Bump
        env:
          BUMP_REPORT_DIR: ${{ runner.temp }}/bump
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$BUMP_REPORT_DIR"
          just bump
      # A bump that moves mise itself settles and gates with the mise the tree now asks for: the
      # setup stub's, checked against its release's sha256, or else mise's own update.
      - name: Mise
        run: |
          want=$(sed -n 's/^min_version *= *"\(.*\)"$/\1/p' .config/mise/conf.d/devset-mise.toml 2> /dev/null || true)
          have=$(mise --version | cut -d' ' -f1)
          if [[ -z $want || $(printf '%s\n' "$want" "$have" | sort -V | head -n1) == "$want" ]]; then
            exit 0
          fi
          if [[ -x setup.sh ]]; then
            ./setup.sh --yes
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            mise self-update --yes --no-plugins "$want"
          fi
      - name: Settle
        continue-on-error: true
        run: just fix
      - id: gate
        name: Gate
        continue-on-error: true
        run: just check
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP: ${{ steps.app.outputs.token != '' }}
          GATE: ${{ steps.gate.outcome }}
          REPORTS: ${{ runner.temp }}/bump
        with:
          # GitHub's API answers a 5xx now and then: each request is tried three more times.
          retries: 3
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const bump = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/bump.js`)
            await bump({ github, context, core, exec })
