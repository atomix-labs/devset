# Watches every scheduled workflow, as .github/workflows/ declares them: one that fails, stops
# running, or is disabled gets an issue, closed when it recovers. It lists no workflow, so a new
# one is watched from its first schedule.
name: watch

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const watch = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/watch.js`)
            await watch({ github, context, core })
