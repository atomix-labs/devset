# Checks a pull request's title against committed.toml, since the pull request lands squashed, as
# one commit its title names: on every change to the pull request, its title's edits included.
# Require the job `title` beside `check` in the default branch's ruleset.
name: title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # Each pull request in a merge group had its title checked: `title` passes there.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISE_LOCKED: "1"
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.13
          install_args: github:crate-ci/committed
          # Its cache would hold committed alone, under the key `check` fills with every tool.
          cache: false
      - if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: committed --commit-file - <<< "$TITLE"
