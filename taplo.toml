# Every TOML file, in one layout. Left out: build output, and what devset owns whole: its records,
# and the profiles' pins.
exclude = ["**/node_modules/**", "**/target/**", ".devset/**", ".config/mise/conf.d/**"]

[formatting]
column_width          = 100
align_entries         = true
align_comments        = true
array_trailing_comma  = true
array_auto_expand     = true
array_auto_collapse   = true
compact_arrays        = true
compact_inline_tables = false
compact_entries       = false
indent_tables         = false
indent_entries        = false
indent_string         = "    "
inline_table_expand   = false
trailing_newline      = true
reorder_keys          = false
reorder_arrays        = false
allowed_blank_lines   = 1

# Dependency tables in alphabetical order. A blank line is a barrier, so `# external` and
# `# internal` stay apart.
[[rule]]
include = ["**/Cargo.toml"]
keys    = ["dependencies", "dev-dependencies", "build-dependencies", "workspace.dependencies"]

[rule.formatting]
reorder_keys = true
