[book]
title       = "devset"
description = "Share your repositories' configuration, and keep it in sync without losing local edits."
language    = "en"

[output.html]
git-repository-url   = "https://github.com/atomix-labs/devset"
edit-url-template    = "https://github.com/atomix-labs/devset/edit/main/docs/{path}"
site-url             = "/devset/"
default-theme        = "light"
preferred-dark-theme = "navy"

# What the book loads: its look, and what each feature brings.
additional-css = [
    "vendor/katex/katex.min.css",
    "theme/palette.css",
    "theme/prompt.css",
    "theme/width.css",
    "theme/details.css",
    "theme/logo.css",
]
additional-js = ["mermaid.min.js", "mermaid-init.js", "api-link.js"]

[output.html.fold]
enable = true
level  = 1

[output.html.search]
enable          = true
limit-results   = 30
use-boolean-and = true

[preprocessor.katex]
after  = ["links"]
no-css = true

[preprocessor.rustdoc-links]
unstable-features = true
base-url          = "/api"
fail-on-warnings  = "always"

[preprocessor.mermaid]
command = "mdbook-mermaid"
